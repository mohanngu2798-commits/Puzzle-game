name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test game logic
        run: ./gradlew :core:test
      - name: Build test APK
        run: ./gradlew :app:assembleDebug
      - name: Render screenshots
        continue-on-error: true
        run: ./gradlew :app:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pudhir-screenshots
          path: app/src/test/snapshots/images/
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "pudhir-test-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pudhir-test-apk
          path: pudhir-test-*.apk
      # Every build is also published as a pre-release, so the APK can be downloaded straight from a phone.
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" "pudhir-test-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease --title "Pudhir test build ${{ github.run_number }}" \
            --notes "Test build from ${{ github.ref_name }} (${{ github.sha }})."
